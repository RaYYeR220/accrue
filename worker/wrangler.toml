name = "accrue-core"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# every minute, one small job per run (see src/scheduled.ts): the free plan allows 10 ms of CPU each
crons = ["* * * * *"]

[vars]
NIM_RPCS = "https://rpc.nimiqwatch.com"
POLYGON_RPCS = "https://polygon-bor-rpc.publicnode.com,https://1rpc.io/matic,https://polygon.drpc.org"
RELAYER_ADDRESS = "0x6967c6f5cAD390E5D506974d8A8Cd2e4e0374057"
ROUTER_ADDRESS = ""

[[d1_databases]]
binding = "DB"
database_name = "accrue"
database_id = "cb05ab3f-5036-4349-b5bb-d9f734597008"

[[durable_objects.bindings]]
name = "RELAYER"
class_name = "Relayer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relayer"]
