<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Earn on dollars and NIM inside Nimiq Pay, and check that your staking pool really pays." />
    <title>Accrue</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2348;
        --muted: #5c607a;
        --accent: #0582ca;
        --danger: #d94432;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15172b;
          --fg: #f4f4f8;
          --muted: #a6a9c0;
          --accent: #4cb4ff;
          --danger: #ff8a7a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .shell {
        max-width: 40rem;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .hint {
        color: var(--muted);
        font-size: 14px;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      button:disabled {
        opacity: 0.5;
      }
      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
